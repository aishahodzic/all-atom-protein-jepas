# Projector-free canonical protein LeJEPA V1.  Scientific defaults are locked
# here rather than inherited from historical JEPA training.
defaults:
  - nn_ae: nn_130m
  - dataset: pdb/pdb_train_canonical_lejepa
  - _self_

run_name_: canonical_lejepa_v1_100k
seed: 42
independent_view_rotations: false
# AlphaFold-style positional-information ablation. When enabled, residue-index,
# chain-boundary/identity, and absolute-coordinate signals are removed from the
# single-residue stream. Relative sequence/chain and structural information is
# retained only in the pair representation.
pair_only_position_information: false
# One-switch, lightweight evolving-pair experiment. Requires
# pair_only_position_information=true. It enables stable multiplicative
# residue-to-pair updates, narrow triangle multiplication, and a pair
# transition every third encoder layer; pair information reaches residues only
# through attention logits.
pair_only_evolving_pair_repr: false
alignment_level: protein
# Opt-in residue objective: align a physical residue only when it is visible in
# both the global and local view. The same switch restricts protein-centred
# residue SIGReg centring and sampling to visible rows in each individual view.
residue_visible_only_objective: false
masked_kv_mode: visible_only
residue_view_checkpointing: true
residue_compact_visible_kv: false

views:
  num_local_views: 4
  global_mask_pct: 0.20
  local_mask_pct: 0.80
  cropping: false
  global_crop_length: 96
  local_crop_length: 48
  global_crop_fraction_min: null
  global_crop_fraction_max: null
  global_crop_min_length: 48
  global_crop_max_length: null
  locals_within_global: false
  shared_crop_anchor: true
  rotation: false
  physical_token_drop: false
  packed_views: true

readout:
  type: mean_visible_residues

sigreg:
  input: protein_mean
  weight: 0.02
  knots: 17
  num_proj: 1024
  normalize_by_n: false
  joint_views: false
  residue_samples_per_protein: 1
  independent_residue_samples: false
  # Experimental loss-side rescue for the pair-only evolving-pair ablation.
  # When enabled, a deterministic variance floor and covariance decorrelation
  # are applied across proteins after averaging their five view embeddings.
  vicreg_rescue: false
  vicreg_weight: 1.0
  vicreg_target_std: 1.0
  vicreg_covariance_weight: 1.0

optimizer:
  type: AdamW
  lr: 4.0e-4
  weight_decay: 0.04
  betas: [0.9, 0.95]
  amsgrad: false
  exclude_bias_norm: true

schedule:
  type: LinearWarmupCosineAnnealing
  total_steps: 100000
  peak_step: 12000
  start_lr: 1.0e-4
  end_lr: 4.0e-4
  interval: step

ema:
  enabled: true
  decay: 0.9999
  update_every: 32
  start_step: 0
  include: ["encoder"]
  exclude: []
  save_key: state_dict_ema
  device: cuda
  dtype: float32

trainer:
  accelerator: gpu
  devices: 2
  num_nodes: 1
  strategy: ddp
  use_distributed_sampler: false
  precision: bf16-mixed
  max_steps: 100000
  max_epochs: -1
  accumulate_grad_batches: 1
  limit_val_batches: 0
  num_sanity_val_steps: 0
  gradient_clip_val: null
  log_every_n_steps: 1
  enable_checkpointing: true

checkpoint:
  dirpath: null
  filename: "step-{step:08d}"
  every_n_train_steps: 10000
  additional_every_n_train_steps: null
  # Optional exact numbered milestones. Each value installs a checkpoint
  # cadence at that step; when max_steps is capped at the largest milestone,
  # this produces exactly one checkpoint per requested value.
  additional_train_steps: null
  # Keep immutable numbered milestones every 10k, but refresh the rolling
  # full-state recovery checkpoint more frequently.
  last_every_n_train_steps: 1500
  save_top_k: -1
  save_last: true
  save_weights_only: false
  auto_insert_metric_name: false

wandb:
  enabled: true
  project: canonical-protein-lejepa
  entity: aisha-hodzic-org

resume:
  ckpt_path: null
