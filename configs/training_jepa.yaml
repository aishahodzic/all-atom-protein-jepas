run_name_: jepa_random_masking_70

hardware:
  ncpus_per_task_train_: 24  # Number of CPUs per task during training
  ncpus_per_task_prepro_: 32  # Number of CPUs used for data preprocessing run
  accelerator: gpu
  ngpus_per_node_: 2  # Number of GPUs per node
  nnodes_: 1  # Number of nodes

defaults:
  - nn_ae: nn_130m  # reuse the existing encoder architecture (trained from scratch for JEPA)
  - dataset: pdb/pdb_train_ucond
  - _self_

# Pre-training checkpoint to start from there (JEPA trains from scratch by default)
pretrain_ckpt_path:

# Optional JEPA ablations; all disabled by default.
baseline_run_layernorm: false
baseline_run_ema: false
baseline_run_predictor: false
# LeJEPA SIGReg mixture weight in
# (1 - sigreg_lambda) * prediction_loss + sigreg_lambda * SIGReg.
sigreg_lambda: 0.02
lejepa_relative_positions: false
jepa_independent_target_rotation: false
dataset:
  datamodule:
    batch_size: 4

# Predictor (JEPA). max_len must be >= the dataset max crop length (see dataset.max_length).
predictor:
  max_len: 256
  relative_position_max_distance: 128

# Precision
force_precision_f32: False  # If false will use bf16-mixed precision

# Optimization
opt:
  lr: 0.0001
  max_epochs: 10000000
  accumulate_grad_batches: 1
  skip_nan_grad: False  # Skip updates with nan gradient
  grad_and_weight_analysis: True  # Log some statistics of gradients and weights
  dist_strategy: auto  # For multi GPU training, do not change. The 2-GPU hang (2026-07-11) was actually a NCCL P2P/SHM transport issue, fixed via NCCL_P2P_DISABLE=1 NCCL_SHM_DISABLE=1 at launch -- find_unused_parameters was a ruled-out hypothesis (confirmed zero unused params, pure overhead).
  val_check_interval: 5000  # Number of training steps after which we check validation loss
  skip_large_grad_updates:
    use: False  # Do not skip updates large gradients
    moving_avg_size: 100
    factor_threshold: 10
    min_opt_steps: 1500

# wandb logging and checkpoints
log:
  wandb_project: protein_jepa
  log_wandb: True  # whether to log to wandb
  log_every_n_steps: 1  # wandb logging frequency
  checkpoint: True  # whether to store checkpoints
  checkpoint_every_n_steps: 10000  # How often we store a checkpoint, should be greater than val_check_interval in `opt`
  last_ckpt_every_n_steps: 1500  # How often do we update our last ckpt, needed for requeuing without losing progress

seed: 42
